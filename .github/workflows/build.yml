name: Full-Stack CI (React PWA + ASP.NET Core 10)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js (React PWA)
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Install & Build React PWA Frontend
      working-directory: client
      run: |
        npm ci
        npm run build

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore .NET dependencies
      run: dotnet restore MafiaGameBackend.slnx

    - name: Build .NET Solution
      run: dotnet build MafiaGameBackend.slnx --no-restore -c Release

    - name: Execute Automated xUnit Tests
      run: dotnet test MafiaGameBackend.slnx --no-build -c Release --verbosity normal
